ServerName customer-service
ServerRoot /etc/apache2
PidFile /tmp/httpd.pid
Mutex posixsem default
Listen 8081

LoadModule mpm_prefork_module /usr/lib/apache2/modules/mod_mpm_prefork.so
LoadModule authz_core_module /usr/lib/apache2/modules/mod_authz_core.so
LoadModule alias_module /usr/lib/apache2/modules/mod_alias.so
LoadModule cgi_module /usr/lib/apache2/modules/mod_cgi.so
LoadModule mime_module /usr/lib/apache2/modules/mod_mime.so
LoadModule env_module /usr/lib/apache2/modules/mod_env.so
LoadModule headers_module /usr/lib/apache2/modules/mod_headers.so

TypesConfig /etc/mime.types
ErrorLog /dev/stderr
LogLevel warn
LogFormat "%h %m %U %>s %b %Dus" bankcore
CustomLog /dev/stdout bankcore

ServerTokens Prod
ServerSignature Off
TraceEnable Off
Timeout 30
LimitRequestBody 8192
LimitRequestFields 40

PassEnv DD_CUSTMAST DD_CREDMAST COB_LIBRARY_PATH LD_LIBRARY_PATH
SetEnv DD_SOAPIN /dev/stdin
SetEnv DD_SOAPOUT /dev/stdout
SetEnv COB_DISABLE_WARNINGS yes

DocumentRoot /opt/custcore/www
<Directory />
    Require all denied
    Options None
    AllowOverride None
</Directory>

<Directory /opt/custcore/www>
    Require all granted
    Options -Indexes -ExecCGI -FollowSymLinks
    AllowOverride None
</Directory>

<Directory /opt/custcore/bin>
    Require all granted
    Options +ExecCGI -Indexes -FollowSymLinks
    AllowOverride None
</Directory>

ScriptAlias /customer-service /opt/custcore/bin/CSTSOAP
Alias /customer-service.wsdl /opt/custcore/www/customer-service.wsdl

<Location /customer-service>
    <LimitExcept POST>
        Require all denied
    </LimitExcept>
</Location>
